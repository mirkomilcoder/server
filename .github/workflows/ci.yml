name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Installer (shellcheck + bats)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck bats
      - name: shellcheck
        run: shellcheck -x install.sh bin/mirkomil installer/main.sh installer/uninstall.sh installer/lib/*.sh installer/modules/*.sh
      - name: bats
        run: bats tests/bats

  agent:
    name: Guardian agent (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest==8.3.4
      - run: PYTHONPATH=agent python -m pytest -q tests/agent

  panel:
    name: Panel (typecheck, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
